<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Routine - Schedule Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#EDEDEA; --dot:#DDDBD2; --chrome:#FAFAF8; --card:#FFFFFF;
    --ink:#1B1C1E; --muted:#8A8D91; --line:#E1E1DD;
    --accent:#2F5DE3; --accent-soft:#E9EEFD;
  }
  [data-theme="dark"]{
    --bg:#17181B; --dot:#232529; --chrome:#1D1F23; --card:#202226;
    --ink:#EDEDEE; --muted:#8C9096; --line:#2C2E33;
    --accent:#6E93FF; --accent-soft:#232C45;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    color:var(--ink); font-family:'Inter', sans-serif; display:flex; flex-direction:column; height:100vh;
    background:radial-gradient(var(--dot) 1px, transparent 1px) 0 0/20px 20px, var(--bg);
    transition:background .2s ease, color .2s ease;
  }
  .topbar{
    height:52px; background:var(--chrome); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 14px; flex-shrink:0; z-index:40;
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark-link{ text-decoration:none; display:block; flex-shrink:0; }
  .brand-mark{
    width:36px; height:36px; border-radius:9px; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition:transform .15s ease, background .15s ease;
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-mark-link:hover .brand-mark{ transform:scale(1.06); background:var(--ink); }
  .brand h1{ font-family:'Fraunces', serif; font-weight:700; font-size:1.05rem; margin:0; white-space:nowrap; }
  .tb-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .iconbtn{
    width:34px; height:34px; border-radius:8px; border:none; background:transparent;
    color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .iconbtn:hover{ background:var(--line); }
  .iconbtn svg{ width:17px; height:17px; }
  .export-btn{
    display:flex; align-items:center; gap:6px; padding:0 12px; height:34px; border-radius:8px;
    border:1.5px solid var(--ink); background:var(--chrome); color:var(--ink); cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:700; font-size:0.78rem; white-space:nowrap;
  }
  .export-btn.primary{ background:var(--ink); color:var(--bg); }
  .export-btn svg{ width:14px; height:14px; }
  .divider{ width:1px; height:22px; background:var(--line); margin:0 2px; }

  .body-row{ flex:1; display:flex; min-height:0; }
  .editor-panel{
    width:320px; flex-shrink:0; border-right:1px solid var(--line); background:var(--chrome);
    overflow-y:auto; padding:16px; transition:width .2s ease, padding .2s ease, opacity .15s ease;
  }
  .editor-panel.collapsed{ width:0; padding:16px 0; opacity:0; overflow:hidden; border-right-color:transparent; }

  .field-group{ margin-bottom:16px; }
  .field-group label{ display:block; font-size:0.72rem; font-weight:600; color:var(--muted); margin-bottom:5px; }
  .field-group input[type=text]{
    width:100%; border:1px solid var(--line); border-radius:7px; padding:8px 10px;
    font-family:'Inter',sans-serif; font-size:0.86rem; background:var(--bg); color:var(--ink);
  }
  .field-group input:focus{ outline:none; border-color:var(--accent); }
  .mode-row{ display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; margin-bottom:16px; }
  .mode-row button{
    flex:1; border:none; background:var(--card); color:var(--muted); padding:9px 0;
    font-family:'Inter',sans-serif; font-weight:700; font-size:0.8rem; cursor:pointer;
  }
  .mode-row button.selected{ background:var(--accent); color:#fff; }

  .entries{ display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .entry-row{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .entry-top{ display:flex; gap:6px; margin-bottom:6px; }
  .entry-top input, .entry-top select{
    border:1px solid var(--line); border-radius:6px; padding:6px 6px; font-size:0.76rem;
    background:var(--bg); color:var(--ink); font-family:'IBM Plex Mono',monospace; min-width:0;
  }
  .entry-top select{ flex:1.1; }
  .entry-top input[type=time]{ flex:1.2; }
  .entry-bottom{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .entry-bottom:last-child{ margin-bottom:0; }
  .entry-bottom input[type=text]{
    flex:1; min-width:0; border:1px solid var(--line); border-radius:6px; padding:7px 8px; font-size:0.84rem;
    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
  }
  .entry-actions{ display:flex; gap:2px; flex-shrink:0; }
  .entry-actions button{
    width:24px; height:24px; border:none; background:transparent; color:var(--muted);
    border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .entry-actions button:hover{ background:var(--line); }
  .entry-actions button svg{ width:13px; height:13px; }
  .entry-actions button.del:hover{ color:#E8556E; }
  .add-entry-btn{
    width:100%; padding:10px; border-radius:9px; border:1.5px dashed var(--line);
    background:transparent; color:var(--muted); font-family:'Inter',sans-serif;
    font-weight:600; font-size:0.82rem; cursor:pointer; margin-bottom:18px;
  }
  .add-entry-btn:hover{ border-color:var(--accent); color:var(--accent); }
  textarea{
    width:100%; min-height:240px; resize:vertical; font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem; line-height:1.6; border:1px solid var(--line); border-radius:8px;
    padding:10px; background:var(--bg); color:var(--ink); margin-bottom:8px;
  }
  textarea:focus{ outline:none; border-color:var(--accent); }
  .hint{ font-size:0.74rem; color:var(--muted); line-height:1.5; margin:0 0 16px; }
  .hint code{ font-family:'IBM Plex Mono',monospace; background:var(--accent-soft); color:var(--accent); padding:1px 4px; border-radius:4px; }
  .parse-warning{ font-size:0.76rem; color:#E8556E; margin:-6px 0 14px; }

  .poster-viewport{ flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:24px; }
  .poster-scale-wrap{ flex-shrink:0; }
  .poster-scale-inner{ transform-origin:top left; }
  .done-btn{
    display:none; position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    z-index:50; background:var(--ink); color:var(--bg); border:none; border-radius:24px;
    padding:12px 22px; font-family:'Inter',sans-serif; font-weight:700; font-size:0.88rem;
    box-shadow:0 6px 18px rgba(0,0,0,.25); align-items:center; gap:8px; cursor:pointer;
  }
  .done-btn svg{ width:16px; height:16px; }

  @media (max-width:820px){
    .editor-panel{ position:absolute; inset:52px 0 0 0; width:100%; height:calc(100% - 52px); z-index:35; padding:18px; }
    .editor-panel.collapsed{ width:100%; opacity:0; pointer-events:none; }
    #editorToggle{ display:none; }
    .done-btn.show{ display:flex; }
    .brand h1{ display:none; }
    .export-btn span{ display:none; }
    .export-btn{ width:34px; padding:0; justify-content:center; }
  }

  /* ---------- Poster (fixed 1080x1080, same design language as the exam poster) ---------- */
  #poster{
    --rh:40px; --pad:20px; --gap:16px; --minh:84px; --fs:24px; --tfs:19px; --stubfs:34px;
    width:1080px; height:1080px; flex-shrink:0; position:relative;
    background:
      radial-gradient(circle at 15% 10%, rgba(201,166,107,0.07), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(181,83,60,0.10), transparent 45%),
      #14202B;
    font-family:'Inter', sans-serif; display:flex; flex-direction:column; overflow:hidden;
  }
  #poster::before{
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(246,241,231,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(246,241,231,0.028) 1px, transparent 1px);
    background-size:27px 27px; pointer-events:none;
  }
  #poster .p-header{ position:relative; padding:52px 72px 26px 72px; }
  #poster .p-eyebrow{ font-family:'Space Mono', monospace; font-size:15px; letter-spacing:0.32em; text-transform:uppercase; color:#C9A66B; margin-bottom:14px; }
  #poster .p-title{ font-family:'Playfair Display', serif; font-weight:900; font-size:58px; color:#F6F1E7; line-height:1.02; letter-spacing:-0.01em; }
  #poster .p-subtitle{ font-family:'Space Mono', monospace; font-size:16px; color:rgba(246,241,231,0.5); margin-top:12px; letter-spacing:0.04em; min-height:20px; }
  #poster .p-rule{ height:1px; margin:0 72px; background:linear-gradient(90deg, rgba(201,166,107,0.6), rgba(201,166,107,0.05)); }
  #poster .p-tickets{
    position:relative; flex:1; display:flex; flex-direction:column; justify-content:center;
    gap:var(--gap); padding:24px 72px 22px 72px; min-height:0;
  }
  #poster .p-ticket{
    position:relative; display:flex; align-items:stretch; background:#F6F1E7; min-height:var(--minh);
    border-radius:14px; box-shadow:0 14px 30px -12px rgba(0,0,0,0.45); overflow:hidden; flex-shrink:0;
  }
  #poster .p-ticket-main{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:var(--pad) 32px; min-width:0; }
  #poster .p-row{
    display:grid; grid-template-columns:230px 1fr auto; align-items:center; column-gap:18px; min-height:var(--rh);
  }
  #poster .p-row + .p-row{ border-top:1px dashed rgba(20,32,43,0.18); }
  #poster .p-subject-date{ font-family:'Space Mono', monospace; font-weight:700; font-size:var(--tfs); color:#B5533C; letter-spacing:0.02em; white-space:nowrap; }
  #poster .p-subject-name{ font-family:'Playfair Display', serif; font-weight:700; font-size:var(--fs); color:#1B2430; letter-spacing:-0.01em; }
  #poster .p-room{ font-family:'Space Mono', monospace; font-size:calc(var(--tfs) - 4px); color:rgba(20,32,43,0.5); letter-spacing:0.06em; text-align:right; }
  #poster .p-ticket-stub{
    position:relative; width:150px; flex-shrink:0; background:#1B2430;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  }
  #poster .p-ticket-stub::before{
    content:""; position:absolute; left:-9px; top:50%; transform:translateY(-50%);
    width:18px; height:18px; background:#14202B; border-radius:50%;
  }
  #poster .p-perf{
    position:absolute; left:0; top:0; bottom:0; width:1px;
    background-image:linear-gradient(rgba(20,32,43,0.35) 60%, transparent 0%);
    background-size:1px 10px; background-repeat:repeat-y;
  }
  #poster .p-stub-time{ font-family:'Space Mono', monospace; font-weight:700; font-size:var(--stubfs); color:#F6F1E7; letter-spacing:0.04em; }
  #poster .p-stub-label{ font-family:'Space Mono', monospace; font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:#C9A66B; text-align:center; padding:0 8px; }
  #poster .p-footer{
    position:relative; display:flex; justify-content:space-between; align-items:center;
    padding:0 72px 40px 72px; font-family:'Space Mono', monospace; font-size:13px;
    color:rgba(246,241,231,0.38); letter-spacing:0.08em;
  }
  #poster .p-footer .dot{ color:#C9A66B; margin:0 10px; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <a href="../index.html" class="brand-mark-link" title="Back to Stylers hub">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        </span>
      </a>
      <h1>Class Routine</h1>
    </div>
    <div class="tb-actions">
      <button class="iconbtn" id="editorToggle" title="Toggle panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><line x1="9.5" y1="4" x2="9.5" y2="20"/></svg>
      </button>
      <div class="divider"></div>
      <button class="export-btn" id="exportPngBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span>PNG</span>
      </button>
      <button class="export-btn primary" id="exportPdfBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><path d="M9 15h6M9 11h2"/></svg>
        <span>PDF</span>
      </button>
      <div class="divider"></div>
      <button class="iconbtn" id="darkBtn" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>

  <div class="body-row">
    <div class="editor-panel" id="editorPanel">
      <div class="field-group">
        <label>Title</label>
        <input type="text" id="titleInput" placeholder="Class Routine">
      </div>
      <div class="field-group">
        <label>Subtitle</label>
        <input type="text" id="subtitleInput" placeholder="auto, from class days">
      </div>
      <div class="field-group">
        <label>Footer message</label>
        <input type="text" id="footerInput" placeholder="SHOW UP · STAY CURIOUS">
      </div>

      <div class="mode-row" id="modeRow">
        <button class="selected" data-mode="form">Form</button>
        <button data-mode="text">Text</button>
      </div>

      <div id="formMode">
        <div class="entries" id="entriesList"></div>
        <button class="add-entry-btn" id="addEntryBtn">+ Add class</button>
      </div>

      <div id="textMode" style="display:none;">
        <p class="hint">
          One class per line: <code>day | time range | subject | room</code>.
          Day can be <code>Sun</code>, <code>Monday</code>, etc. Time like <code>8:30 AM - 9:20 AM</code>. Room is optional.
        </p>
        <textarea id="textInput" spellcheck="false"></textarea>
        <div class="parse-warning" id="parseWarning" style="display:none;"></div>
      </div>
    </div>

    <div class="poster-viewport" id="posterViewport">
      <div class="poster-scale-wrap" id="posterScaleWrap">
        <div class="poster-scale-inner" id="posterScaleInner">
          <div id="poster">
            <div class="p-header">
              <div class="p-eyebrow">Weekly &nbsp;·&nbsp; Class Term</div>
              <div class="p-title" id="pTitle">Class Routine</div>
              <div class="p-subtitle" id="pSubtitle"></div>
            </div>
            <div class="p-rule"></div>
            <div class="p-tickets" id="pTickets"></div>
            <div class="p-footer">
              <div id="pCount">0 CLASSES</div>
              <div id="pFooterMsg">SHOW UP<span class="dot">·</span>STAY CURIOUS</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button class="done-btn" id="doneBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    View poster
  </button>

<script>
  const STORAGE_KEY = 'classroutine:data';
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const DAYS_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  const defaultEntries = [
    { day:0, start:'08:30', end:'09:20', subject:'Physics',          room:'Room 301' },
    { day:0, start:'09:30', end:'10:20', subject:'Mathematics',      room:'Room 301' },
    { day:1, start:'08:30', end:'09:20', subject:'Chemistry',        room:'Room 204' },
    { day:1, start:'10:30', end:'11:20', subject:'English',          room:'Room 112' },
    { day:2, start:'09:30', end:'11:20', subject:'Physics Lab',      room:'Lab 2' },
    { day:3, start:'08:30', end:'09:20', subject:'Mathematics',      room:'Room 301' },
    { day:3, start:'11:30', end:'12:20', subject:'Computer Science', room:'Lab 1' },
    { day:4, start:'08:30', end:'09:20', subject:'Chemistry',        room:'Room 204' },
    { day:4, start:'09:30', end:'10:20', subject:'English',          room:'Room 112' }
  ];

  let state = { title:'Class Routine', subtitle:'', footer:'', mode:'form', entries:defaultEntries };
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.entries && saved.entries.length) state = Object.assign(state, saved);
  }catch(e){}
  function persist(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }

  function esc(str){
    return String(str == null ? '' : str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---------- Time formatting ----------
  function parts12(hhmm){
    const [h, m] = hhmm.split(':').map(Number);
    return { t:`${((h + 11) % 12) + 1}:${String(m).padStart(2,'0')}`, mer: h >= 12 ? 'PM' : 'AM' };
  }
  function to12Hour(hhmm){
    if (!hhmm) return '';
    const p = parts12(hhmm);
    return `${p.t} ${p.mer}`;
  }
  function rangeLabel(start, end){
    if (!start) return '--:--';
    const a = parts12(start);
    if (!end) return `${a.t} ${a.mer}`;
    const b = parts12(end);
    return a.mer === b.mer ? `${a.t} - ${b.t} ${b.mer}` : `${a.t} ${a.mer} - ${b.t} ${b.mer}`;
  }
  function autoSubtitle(entries){
    const days = [...new Set(entries.map(e => Number(e.day)))].sort((a,b) => a-b);
    if (!days.length) return '';
    const contiguous = days.length > 2 && days[days.length-1] - days[0] === days.length - 1;
    return (contiguous ? `${DAYS_FULL[days[0]]} - ${DAYS_FULL[days[days.length-1]]}` : days.map(d => DAYS_FULL[d]).join(' · ')).toUpperCase();
  }

  // ---------- Poster rendering ----------
  const TIERS = [
    { rh:40, pad:20, gap:16, minh:84, fs:24, tfs:19, stubfs:34 },
    { rh:34, pad:15, gap:12, minh:68, fs:21, tfs:17, stubfs:30 },
    { rh:28, pad:11, gap:9,  minh:56, fs:18, tfs:15, stubfs:26 },
    { rh:23, pad:7,  gap:6,  minh:44, fs:15, tfs:13, stubfs:22 }
  ];
  function groupByDay(entries){
    const groups = {};
    entries.forEach(e => { (groups[Number(e.day)] = groups[Number(e.day)] || []).push(e); });
    return Object.keys(groups).map(Number).sort((a,b) => a-b).map(d => ({
      day:d, list:groups[d].slice().sort((a,b) => (a.start || '99:99').localeCompare(b.start || '99:99'))
    }));
  }
  function pickTier(groups){
    const limit = 750;
    for (const t of TIERS){
      const total = groups.reduce((s,g) => s + Math.max(t.minh, g.list.length * t.rh + t.pad * 2), 0) + Math.max(0, groups.length - 1) * t.gap;
      if (total <= limit) return t;
    }
    return TIERS[TIERS.length - 1];
  }

  function renderPoster(){
    const poster = document.getElementById('poster');
    const groups = groupByDay(state.entries);
    const t = pickTier(groups);
    poster.style.setProperty('--rh', t.rh + 'px');
    poster.style.setProperty('--pad', t.pad + 'px');
    poster.style.setProperty('--gap', t.gap + 'px');
    poster.style.setProperty('--minh', t.minh + 'px');
    poster.style.setProperty('--fs', t.fs + 'px');
    poster.style.setProperty('--tfs', t.tfs + 'px');
    poster.style.setProperty('--stubfs', t.stubfs + 'px');

    document.getElementById('pTitle').textContent = state.title || 'Class Routine';
    document.getElementById('pSubtitle').textContent = state.subtitle || autoSubtitle(state.entries);
    document.getElementById('pFooterMsg').innerHTML = (state.footer || 'SHOW UP · STAY CURIOUS')
      .split('·').map(s => esc(s.trim())).join('<span class="dot">·</span>');
    const n = state.entries.length;
    document.getElementById('pCount').textContent = n + (n === 1 ? ' CLASS' : ' CLASSES');

    const ticketsEl = document.getElementById('pTickets');
    ticketsEl.innerHTML = groups.map(g => {
      const rows = g.list.map(e => `
        <div class="p-row">
          <div class="p-subject-date">${rangeLabel(e.start, e.end)}</div>
          <div class="p-subject-name">${esc(e.subject || 'Untitled')}</div>
          <div class="p-room">${esc(e.room || '')}</div>
        </div>`).join('');
      const c = g.list.length;
      return `
        <div class="p-ticket">
          <div class="p-ticket-main">${rows}</div>
          <div class="p-ticket-stub">
            <div class="p-perf"></div>
            <div class="p-stub-time">${DAYS[g.day].toUpperCase()}</div>
            <div class="p-stub-label">${c} ${c === 1 ? 'CLASS' : 'CLASSES'}</div>
          </div>
        </div>`;
    }).join('');
    updateScale();
  }

  // ---------- Scale-to-fit ----------
  function updateScale(){
    const container = document.getElementById('posterViewport');
    const wrap = document.getElementById('posterScaleWrap');
    const inner = document.getElementById('posterScaleInner');
    const scale = Math.min(1, (container.clientWidth - 40) / 1080, (container.clientHeight - 40) / 1080);
    inner.style.transform = `scale(${scale})`;
    wrap.style.width = (1080 * scale) + 'px';
    wrap.style.height = (1080 * scale) + 'px';
  }
  window.addEventListener('resize', updateScale);

  // ---------- Top fields ----------
  const titleInput = document.getElementById('titleInput');
  const subtitleInput = document.getElementById('subtitleInput');
  const footerInput = document.getElementById('footerInput');
  titleInput.value = state.title;
  subtitleInput.value = state.subtitle;
  footerInput.value = state.footer;
  [titleInput, subtitleInput, footerInput].forEach(el => {
    el.addEventListener('input', () => {
      state.title = titleInput.value;
      state.subtitle = subtitleInput.value;
      state.footer = footerInput.value;
      persist(); renderPoster();
    });
  });

  // ---------- Form mode ----------
  const entriesList = document.getElementById('entriesList');
  const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>';
  const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';

  function renderEntries(){
    entriesList.innerHTML = '';
    state.entries.forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'entry-row';
      row.innerHTML = `
        <div class="entry-top">
          <select data-field="day">${DAYS.map((d, k) => `<option value="${k}" ${Number(entry.day) === k ? 'selected' : ''}>${d}</option>`).join('')}</select>
          <input type="time" value="${esc(entry.start)}" data-field="start" title="Start time">
          <input type="time" value="${esc(entry.end)}" data-field="end" title="End time (optional)">
        </div>
        <div class="entry-bottom">
          <input type="text" value="${esc(entry.subject)}" data-field="subject" placeholder="Subject name">
          <div class="entry-actions">
            <button data-act="up" title="Move up">${ICON_UP}</button>
            <button data-act="down" title="Move down">${ICON_DOWN}</button>
            <button data-act="del" class="del" title="Delete">${ICON_DEL}</button>
          </div>
        </div>
        <div class="entry-bottom">
          <input type="text" value="${esc(entry.room)}" data-field="room" placeholder="Room or teacher (optional)">
        </div>`;

      row.querySelectorAll('[data-field]').forEach(inp => {
        const ev = inp.tagName === 'SELECT' ? 'change' : 'input';
        inp.addEventListener(ev, () => {
          state.entries[i][inp.dataset.field] = inp.dataset.field === 'day' ? Number(inp.value) : inp.value;
          persist(); renderPoster();
        });
      });
      row.querySelector('[data-act="del"]').addEventListener('click', () => {
        state.entries.splice(i, 1); persist(); renderEntries(); renderPoster();
      });
      row.querySelector('[data-act="up"]').addEventListener('click', () => {
        if (i === 0) return;
        [state.entries[i-1], state.entries[i]] = [state.entries[i], state.entries[i-1]];
        persist(); renderEntries(); renderPoster();
      });
      row.querySelector('[data-act="down"]').addEventListener('click', () => {
        if (i === state.entries.length - 1) return;
        [state.entries[i+1], state.entries[i]] = [state.entries[i], state.entries[i+1]];
        persist(); renderEntries(); renderPoster();
      });
      entriesList.appendChild(row);
    });
  }

  document.getElementById('addEntryBtn').addEventListener('click', () => {
    const last = state.entries[state.entries.length - 1];
    state.entries.push({ day: last ? Number(last.day) : 0, start:'', end:'', subject:'', room:'' });
    persist(); renderEntries(); renderPoster();
    entriesList.lastElementChild && entriesList.lastElementChild.scrollIntoView({ block:'nearest' });
  });

  // ---------- Text mode ----------
  const textInput = document.getElementById('textInput');
  const parseWarning = document.getElementById('parseWarning');

  function entriesToText(list){
    return list.map(e => {
      const timeStr = e.end ? `${to12Hour(e.start)} - ${to12Hour(e.end)}` : to12Hour(e.start);
      return `${DAYS[Number(e.day)] || 'Sun'} | ${timeStr || '--:--'} | ${e.subject || 'Untitled'} | ${e.room || ''}`.replace(/ \| $/, '');
    }).join('\n');
  }
  function parseTimeTo24(str){
    const m = (str || '').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
    if (!m) return '';
    let h = parseInt(m[1], 10);
    const min = parseInt(m[2], 10);
    const mer = m[3] ? m[3].toUpperCase() : null;
    if (mer === 'PM' && h !== 12) h += 12;
    if (mer === 'AM' && h === 12) h = 0;
    return String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
  }
  function parseDay(str){
    const s = (str || '').trim().toLowerCase();
    return DAYS.findIndex(d => s.startsWith(d.toLowerCase()));
  }
  function parseTextMode(text){
    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const parsed = [], errorLines = [];
    lines.forEach((line, i) => {
      const p = line.split('|').map(s => s.trim());
      if (p.length < 3){ errorLines.push(i + 1); return; }
      const day = parseDay(p[0]);
      if (day < 0){ errorLines.push(i + 1); return; }
      const tp = p[1].split(/-|\u2013|\bto\b/i).map(s => s.trim()).filter(Boolean);
      const start = parseTimeTo24(tp[0]);
      const end = tp[1] ? parseTimeTo24(tp[1]) : '';
      if (!start){ errorLines.push(i + 1); return; }
      parsed.push({ day, start, end, subject: p[2] || 'Untitled', room: p[3] || '' });
    });
    return { parsed, errorLines };
  }

  let textDebounce;
  textInput.addEventListener('input', () => {
    clearTimeout(textDebounce);
    textDebounce = setTimeout(() => {
      const { parsed, errorLines } = parseTextMode(textInput.value);
      if (errorLines.length){
        parseWarning.style.display = 'block';
        parseWarning.textContent = `Couldn't read line${errorLines.length > 1 ? 's' : ''} ${errorLines.join(', ')}. Check the format.`;
      } else {
        parseWarning.style.display = 'none';
      }
      if (parsed.length){ state.entries = parsed; persist(); renderPoster(); }
    }, 400);
  });

  // ---------- Mode switching ----------
  const formModeEl = document.getElementById('formMode');
  const textModeEl = document.getElementById('textMode');
  document.getElementById('modeRow').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const newMode = btn.dataset.mode;
    if (newMode === state.mode) return;
    if (newMode === 'text'){
      textInput.value = entriesToText(state.entries);
      parseWarning.style.display = 'none';
      formModeEl.style.display = 'none';
      textModeEl.style.display = 'block';
    } else {
      const { parsed } = parseTextMode(textInput.value);
      if (parsed.length) state.entries = parsed;
      renderEntries();
      formModeEl.style.display = 'block';
      textModeEl.style.display = 'none';
      renderPoster();
    }
    state.mode = newMode;
    persist();
    document.querySelectorAll('#modeRow button').forEach(b => b.classList.toggle('selected', b === btn));
  });

  // ---------- Editor toggle (desktop sidebar, mobile full-screen swap) ----------
  const editorPanel = document.getElementById('editorPanel');
  const isMobile = () => window.matchMedia('(max-width:820px)').matches;
  const doneBtn = document.getElementById('doneBtn');
  function openEditor(){
    editorPanel.classList.remove('collapsed');
    if (isMobile()) doneBtn.classList.add('show');
  }
  function closeEditor(){
    editorPanel.classList.add('collapsed');
    doneBtn.classList.remove('show');
    setTimeout(updateScale, 220);
  }
  document.getElementById('editorToggle').addEventListener('click', () => {
    editorPanel.classList.contains('collapsed') ? openEditor() : closeEditor();
  });
  doneBtn.addEventListener('click', closeEditor);

  let posterPointerDown = null;
  const vp = document.getElementById('posterViewport');
  vp.addEventListener('pointerdown', (e) => { posterPointerDown = { x:e.clientX, y:e.clientY }; });
  vp.addEventListener('pointerup', (e) => {
    if (!isMobile() || !posterPointerDown) return;
    const moved = Math.hypot(e.clientX - posterPointerDown.x, e.clientY - posterPointerDown.y);
    if (moved < 6 && editorPanel.classList.contains('collapsed')) openEditor();
    posterPointerDown = null;
  });

  // ---------- Export ----------
  async function capturePoster(){
    const inner = document.getElementById('posterScaleInner');
    const prev = inner.style.transform;
    inner.style.transform = 'none';
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(document.getElementById('poster'), { scale:2, backgroundColor:null, useCORS:true });
    inner.style.transform = prev;
    return canvas;
  }
  document.getElementById('exportPngBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true;
    try{
      const canvas = await capturePoster();
      const link = document.createElement('a');
      link.download = 'class-routine.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }catch(err){ alert('Export failed: ' + err.message); }
    btn.disabled = false;
  });
  document.getElementById('exportPdfBtn').addEventListener('click', async (e) => {
    const btn = e.currentTarget; btn.disabled = true;
    try{
      const canvas = await capturePoster();
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit:'px', format:[canvas.width, canvas.height] });
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height);
      pdf.save('class-routine.pdf');
    }catch(err){ alert('Export failed: ' + err.message); }
    btn.disabled = false;
  });

  // ---------- Dark mode (chrome only, poster keeps its own palette) ----------
  document.getElementById('darkBtn').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  });

  // ---------- Init ----------
  if (state.mode === 'text'){
    document.querySelectorAll('#modeRow button').forEach(b => b.classList.toggle('selected', b.dataset.mode === 'text'));
    formModeEl.style.display = 'none';
    textModeEl.style.display = 'block';
    textInput.value = entriesToText(state.entries);
  }
  if (isMobile()) editorPanel.classList.add('collapsed');
  renderEntries();
  renderPoster();
</script>
</body>
</html>
