[package]
name = "textstyler"
version = "0.1.0"
description = "TextStyler Desktop"
authors = ["lifelessray"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = ["custom-protocol"] }

[dependencies]
tauri = { version = "1", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Forward a package feature to the tauri dependency feature so cargo --features custom-protocol works
custom-protocol = ["tauri/custom-protocol"]
